<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body onload="onInit()">

    <header class="main-header">
        <div class="logo"> <img src="img/logo/LOGO.png" alt="Meme Generator"> </div>

        <nav class="main-nav">
            <a href="#" onclick="onNavTo('gallery')">Gallery</a>
            <a href="#" onclick="onNavTo('memes')">Memes</a>
            <a href="#" onclick="onNavTo('about')">About</a>
        </nav>
    </header>

    <main>
        <section id="memes" class="hidden">
            <h2>Saved Memes</h2>
            <div class="saved-memes-grid"></div>
        </section>
        <section id="gallery" class="meme-gallery"></section>

        <section id="editor" class="meme-editor hidden">

            <canvas class="meme-canvas" width="500" height="500" onclick="onCanvasClick(event)">
            </canvas>

            <div class="meme-controls">

                <input class="line-input" type="text" placeholder="Enter your meme text here"
                    oninput="onSetLineTxt(this.value)">

                <div class="line-actions">
                    <button onclick="onSwitchLine()">
                        <img src="img/Icons/up-and-down-opposite-double-arrows-side-by-side.png" alt="Switch line">
                    </button>

                    <button onclick="onAddLine()">
                        <img src="img/Icons/add.png" alt="Add line">
                    </button>

                    <button onclick="onDeleteLine()">
                        <img src="img/Icons/trash.png" alt="Delete line">
                    </button>
                </div>

                <div class="font-size-actions">
                    <button onclick="onIncreaseFontSize()">
                        <img src="img/Icons/increase font - icon.png" alt="Increase font">
                    </button>

                    <button onclick="onDecreaseFontSize()">
                        <img src="img/Icons/decrease font - icon.png" alt="Decrease font">
                    </button>
                </div>

                <div class="align-actions">
                    <button onclick="onSetTextAlign('left')">
                        <img src="img/Icons/align-to-left.png" alt="Align left">
                    </button>

                    <button onclick="onSetTextAlign('center')">
                        <img src="img/Icons/center-text-alignment.png" alt="Align center">
                    </button>

                    <button onclick="onSetTextAlign('right')">
                        <img src="img/Icons/align-to-right.png" alt="Align right">
                    </button>
                </div>

                <div class="font-actions">
                    <select class="line-font" onchange="onSetFont(this.value)">
                        <option value="Arial">Arial</option>
                        <option value="Tahoma">Tahoma</option>
                        <option value="Impact">Impact</option>
                        <option value="Verdana">Verdana</option>
                    </select>

                    <label class="color-btn">
                        <img src="img/Icons/paint-board-and-brush.png" alt="Text color">

                        <input class="line-color" type="color" oninput="onSetLineColor(this.value)">
                    </label>
                </div>

                <div class="position-actions">
                    <button onclick="onUpTextLine()" title="Move text up">↑</button>
                    <button onclick="onDownTextLine()" title="Move text down">↓</button>
                </div>

                <button class="download-btn" onclick="onDownloadMeme()">Download</button>
                <button class="save-btn" onclick="saveMeme()">Save Meme</button>

            </div>
        </section>
        <section id="about" class="hidden"></section>

    </main>
    <script src="js/services/storage.service.js"></script>
    <script src="js/services/meme.service.js"></script>
    <script src="js/controllers/meme.controller.js"></script>
    <script src="js/controllers/gallery.controller.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
